<!--
  Ranktrieb header: mobile menu fix
  =================================
  Problem: on mobile the open menu panel starts ~46px below the header,
  so a strip of the page behind it (dark hero + "Leistungen") shows through.

  Cause: `body.admin-bar .rt .nav { top: calc(var(--hh) + 46px); }`
  always adds 46px for the WordPress admin bar. On screens <= 600px WordPress
  makes the admin bar position:absolute, so it scrolls away, but the menu
  still gets pushed down by 46px. (You only see this while logged in.)

  Fix: measure where the header really ends and open the menu there.
-->

<style>
/* 1) In the @media (max-width: 980px) block, REPLACE the `.rt .nav { ... }`
      rule and the `body.admin-bar .rt .nav { ... }` rule with this: */
@media (max-width: 980px) {
	.rt .nav {
		position: fixed; left: 0; right: 0; bottom: 0; display: block;
		top: var(--rt-nav-top, var(--hh));
		height: calc(100vh - var(--rt-nav-top, var(--hh)));
		height: calc(100dvh - var(--rt-nav-top, var(--hh)));
		background: var(--offwhite); padding: 20px var(--gut) 40px;
		overflow-y: auto; overscroll-behavior: contain;
		opacity: 0; visibility: hidden; transform: translateY(-8px);
		transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
		z-index: 999;
	}
	/* Fallbacks for before the script runs (WP admin bar is fixed only above 600px) */
	body.admin-bar .rt .nav { --rt-nav-top: calc(var(--hh) + 32px); }
	@media (max-width: 782px) { body.admin-bar .rt .nav { --rt-nav-top: calc(var(--hh) + 46px); } }
	@media (max-width: 600px) { body.admin-bar .rt .nav { --rt-nav-top: var(--hh); } }

	/* Stop the page behind from scrolling while the menu is open */
	html:has(.rt .nav.open), body:has(.rt .nav.open) { overflow: hidden; }
}
</style>

<!-- 2) Add this script right AFTER the header markup (after <div class="rt-space"></div></div>) -->
<script>
(function () {
	var header = document.getElementById('rtHeader');
	var nav = document.getElementById('rtNav');
	var burger = document.querySelector('.rt .burger');
	if (!header || !nav) return;
	function place() {
		var bottom = Math.max(0, Math.round(header.getBoundingClientRect().bottom));
		nav.style.setProperty('--rt-nav-top', bottom + 'px');
	}
	place();
	['resize', 'scroll', 'orientationchange'].forEach(function (e) {
		window.addEventListener(e, place, { passive: true });
	});
	if (burger) burger.addEventListener('click', function () { requestAnimationFrame(place); });
})();
</script>
